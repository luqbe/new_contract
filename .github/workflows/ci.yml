name: "CI: Validate Data Contract"

on:
  pull_request:
    branches: [main]
    paths:
      - 'contract/**'           # Triggers when datacontract.yml changes
      - 'databricks.yml'        # Triggers when bundle config changes
      - 'src/**'                # Triggers when python scripts change
      - 'resources/**'          # Triggers when job definitions change

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Validate Soda Contract YAML
      - name: Install Soda Core Spark
        run: pip install soda-core-spark

      - name: Check Contract Syntax
        run: soda contract validate --contract contract/datacontracts.yml

      # 2. Validate Databricks Asset Bundle (Dry Run)
      - name: Setup Databricks CLI
        uses: databricks/setup-cli@main
        with:
          version: 0.299.0

      - name: Bundle Validate
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: databricks bundle validate -t lab