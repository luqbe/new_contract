name: "CI: Validate Data Contract"

on:
  pull_request:
    branches: [main]
    paths:
      - 'contract/**'
      - 'databricks.yml'
      - 'src/**'
      - 'resources/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Install dependencies
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Validation Tools
        run: |
          pip install soda-core-spark pyyaml

      # 2. Check YAML Syntax (Ensures no tabs or bad indentation)
      - name: Validate YAML Syntax
        run: |
          python -c "import yaml, glob; [yaml.safe_load(open(f)) for f in glob.glob('contract/*.yml')]"

      # 3. Setup Databricks CLI
      - name: Setup Databricks CLI
        uses: databricks/setup-cli@main

      # 4. Bundle Validate (Dry Run)
      # This ensures your databricks.yml and resource files are correctly structured
      - name: Bundle Validate
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: databricks bundle validate -t lab