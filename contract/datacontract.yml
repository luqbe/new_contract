# contract/datacontracts.yml
# Standard SodaCL Format (Supported everywhere)

checks for customers_gate:
  - missing_count(customer_id) = 0
  - duplicate_count(customer_id) = 0
  - invalid_count(email) = 0:
      valid_format: email

checks for orders_gate:
  - missing_count(order_id) = 0
  - invalid_count(status) = 0:
      valid_values: [Shipped, Processing, Delivered, Cancelled]

checks for sales_gate:
  - duplicate_count(sale_id) = 0
  - missing_count(total_amount) = 0



